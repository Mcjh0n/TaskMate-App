services:
    - type: web
      name: taskmate
      runtime: docker
      plan: free
      healthCheckPath: /up
      autoDeploy: true
      envVars:
          - key: APP_ENV
            value: production
          - key: APP_DEBUG
            value: 'false'
          - key: TASKMATE_PROTOTYPE_MODE
            value: 'false'
          - key: APP_URL
            value: https://taskmate-app-2ied.onrender.com
          - key: ASSET_URL
            value: https://taskmate-app-2ied.onrender.com
          - key: LOG_CHANNEL
            value: stderr
          - key: APP_KEY
            generateValue: true
          - key: DB_CONNECTION
            value: pgsql
          - key: DB_HOST
            fromDatabase:
                name: taskmate-db
                property: host
          - key: DB_PORT
            fromDatabase:
                name: taskmate-db
                property: port
          - key: DB_DATABASE
            fromDatabase:
                name: taskmate-db
                property: database
          - key: DB_USERNAME
            fromDatabase:
                name: taskmate-db
                property: user
          - key: DB_PASSWORD
            fromDatabase:
                name: taskmate-db
                property: password
          - key: SESSION_DRIVER
            value: database
          - key: CACHE_STORE
            value: database
          - key: QUEUE_CONNECTION
            value: database

databases:
    - name: taskmate-db
      plan: free
      databaseName: taskmate
      user: taskmate
